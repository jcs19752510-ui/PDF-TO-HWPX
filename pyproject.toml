[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-hwpx"
version = "0.1.0"
description = "로컬 전용 PDF -> HWPX(OWPML) 변환 도구 (서버 전송 없음)"
readme = "HARNESS-README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]

# 03단계(docs/harness/03-system-design.md) §2-1이 확정한 런타임 의존성만 포함한다.
# platformdirs는 §2-1 "로컬 경로/설정" 행 + §7-1 로깅 저장 위치(user_log_dir)에
# 근거가 있으며, unit-0 자신의 파일(common/logging_setup.py)이 직접 사용하므로
# 함께 등록했다(unit-0-note.md "설계서 대비 편차" 참고).
dependencies = [
    "pdfplumber>=0.11.0,<1.0",
    "pypdf>=6.0.0,<7.0",
    "lxml>=5.0.0,<7.0",
    "pytesseract>=0.3.10,<1.0",
    "platformdirs>=4.0.0,<5.0",
    # unit-2(image_extractor.py, REQ-003) 구현 중 발견: pypdf.generic._image_xobject가
    # 무조건 `from PIL import Image`를 실행하므로, 이미지가 있는 PDF에서
    # page.images 접근 시 Pillow가 없으면 ModuleNotFoundError가 난다. pypdf 자체
    # 의존성 선언에는 없어(선택적 extra) 여기서 직접 명시한다(오케스트레이터가
    # unit-2 공유문서 갱신 요청을 받아 추가, docs/harness/units/unit-2-note.md 참고).
    "Pillow>=10.0.0,<12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# CLI 진입점(pdftohwpx, 03 §4-3)은 cli/__main__.py를 만드는 unit-11이 이
# 섹션에 [project.scripts]를 추가한다. unit-0은 아직 존재하지 않는 모듈을
# 가리키는 항목을 미리 선언하지 않는다(unit-0-note.md 참고).

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf_to_hwpx*"]
